name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Compile source
        run: python -m compileall src

      - name: Check package imports
        run: python -c "from token_tracker.cli import main; from token_tracker.hooks import setup"

      - name: Run tests
        run: python -m pytest -q

      # 反向环境兜底：本地开发多为 zh locale + 彩色终端，单跑默认环境会漏
      # 中文文案断言 / TERM=dumb 折行两类环境依赖（历史踩坑）
      - name: Run tests (zh locale, dumb terminal)
        run: python -m pytest -q
        env:
          LANG: zh_CN.UTF-8
          LC_ALL: zh_CN.UTF-8
          TERM: dumb
